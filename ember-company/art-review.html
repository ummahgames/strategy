<!doctype html><meta charset="utf-8"><title>Saffron Vanguard · Artwork review</title><style>body{margin:24px;background:#f5eedf;color:#263f43;font:14px system-ui}header{display:flex;align-items:center;gap:18px}h1{font:30px Georgia}select,button{padding:10px;border:1px solid #a98b55;border-radius:7px;background:#fff8e8;color:#28545c}main{max-width:1024px}.scene{position:relative;background:radial-gradient(ellipse at 40% 28%,#e6e7d7,#b3c4b7 65%,#8eaaa4);border:1px solid #b5a177;border-radius:12px;overflow:hidden;margin:15px 0}.scene canvas{width:100%;display:block}.webgl-hud{position:absolute;inset:0;pointer-events:none}.camera-controls{position:absolute;right:14px;bottom:14px;display:flex;gap:5px}.camera-controls span{display:none}.camp{width:100%;border-radius:9px}p{color:#7c795e}</style><header><h1>Saffron Vanguard</h1><select id="biome" aria-label="Battle region"></select><button id="view">Show 2D illustration</button></header><p id="status"></p><main><div id="scene3" class="scene"><canvas id="three" width="896" height="640"></canvas></div><div id="scene2" class="scene" hidden><canvas id="two" width="896" height="640"></canvas></div><h2>A halt beneath the stars</h2><canvas id="camp" class="camp" width="1024" height="400"></canvas></main><script src="engine.js"></script><script src="characters.js"></script><script src="art.js"></script><script src="../ember-company-3d/webgl.js"></script><script>
